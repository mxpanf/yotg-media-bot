name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint:
        name: Lint (ruff, mypy)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Install uv
              run: pip install uv

            - name: Sync dependencies
              run: uv sync --group lint --group test --frozen

            - name: Ruff
              run: uv run ruff check .

            - name: Mypy
              run: uv run mypy app
